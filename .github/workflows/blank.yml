name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build mdns-repeater
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu wget
          wget https://raw.githubusercontent.com/geekman/mdns-repeater/master/mdns-repeater.c
          aarch64-linux-gnu-gcc -static -DHGVERSION='"1.0"' -o mdns-repeater mdns-repeater.c
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mdns-repeater-aarch64
          path: mdns-repeater

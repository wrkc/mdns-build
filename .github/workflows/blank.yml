name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build mdns-repeater static musl
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu wget
          wget https://raw.githubusercontent.com/geekman/mdns-repeater/master/mdns-repeater.c
          aarch64-linux-gnu-gcc -static -DHGVERSION='"1.0"' -o mdns-repeater mdns-repeater.c -Wl,--allow-multiple-definition
          file mdns-repeater
          strings mdns-repeater | grep -i 'dynamic\|interp\|glibc' || echo "no dynamic deps found"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mdns-repeater-aarch64-static
          path: mdns-repeater

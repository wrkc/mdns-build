name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build mdns-repeater
        run: |
          sudo apt-get install -y wget qemu-user-static
          wget https://raw.githubusercontent.com/geekman/mdns-repeater/master/mdns-repeater.c
          docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work alpine:latest \
            sh -c "apk add gcc musl-dev && gcc -static -DHGVERSION='\"1.0\"' -o mdns-repeater mdns-repeater.c && file mdns-repeater"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mdns-repeater-arm64-musl
          path: mdns-repeater
